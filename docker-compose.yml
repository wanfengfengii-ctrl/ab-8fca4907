services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: bianzhong-solver:latest
    container_name: bianzhong-web
    ports:
      # 宿主机端口可通过环境变量 HOST_PORT 配置，默认 8080；容器内固定 8000。
      - "${HOST_PORT:-8080}:8000"
    environment:
      PORT: "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s

  # 一次性校验服务：随 `docker compose up` 启动；等待 web 健康后执行构建
  # 期字节编译校验之外的代码单元测试，并对健康端点、一份可复原残音和
  # 一份无解残音做 API 冒烟，以退出码报告结果后自行退出（web 继续服务）。
  # 只看校验结果可运行：
  #   docker compose up --build --abort-on-container-exit --exit-code-from verify
  verify:
    image: bianzhong-solver:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bianzhong-verify
    depends_on:
      web:
        condition: service_healthy
    entrypoint: ["python", "verify.py", "--base-url", "http://web:8000"]
    restart: "no"
